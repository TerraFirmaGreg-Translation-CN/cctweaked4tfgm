<h1>粘贴</h1><p>当通过 Ctrl-V（或 Mac 上的 ⌘V）将文本粘贴到计算机中时，会触发 <a href="/event/paste/" class="reference"><code>paste</code></a> 事件。</p>
<h2>返回值</h2>
<ol>
<li><a href="https://www.lua.org/manual/5.1/manual.html#5.4" class="reference"><code>string</code></a>：事件名称。</li>
<li><a href="https://www.lua.org/manual/5.1/manual.html#5.4" class="reference"><code>string</code></a> 粘贴的文本。</li>
</ol>
<h2>例子</h2>
<p>打印粘贴的文本：</p>
<div class="lua-example"><pre class="highlight" data-lua-kind="stmt"><span class="keyword">while</span> <span class="literal-kw">true</span> <span class="keyword">do</span>
  <span class="keyword">local</span> <span class="ident">event</span><span class="symbol">,</span> <span class="ident">text</span> <span class="symbol">=</span> <a title="Pause execution of the current thread and waits for any events matching filter." href="/module/os/#v:pullEvent"><span class="ident">os</span><span class="symbol">.</span><span class="symbol">pullEvent</span></a><span class="symbol">(</span><span class="string">&quot;paste&quot;</span><span class="symbol">)</span>
  <span class="ident">print</span><span class="symbol">(</span><span class="string">'&quot;'</span> <span class="symbol">..</span> <span class="ident">text</span> <span class="symbol">..</span> <span class="string">'&quot; was pasted'</span><span class="symbol">)</span>
<span class="keyword">end</span><span class="symbol"></span></pre></div>
