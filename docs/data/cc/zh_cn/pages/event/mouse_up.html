<h1>鼠标向上</h1><p>当释放鼠标按钮或按住的鼠标离开计算机终端时，会触发此事件。</p>
<h2>返回值</h2>
<ol>
<li><a href="https://www.lua.org/manual/5.1/manual.html#5.4" class="reference"><code>string</code></a>：事件名称。</li>
<li><span class="reference reference-unresolved"><code>number</code></span>：释放的<a href="/event/mouse_click/#Mouse_buttons">鼠标按钮</a>。</li>
<li><span class="reference reference-unresolved"><code>number</code></span>：鼠标的 X 坐标。</li>
<li><span class="reference reference-unresolved"><code>number</code></span>：鼠标的 Y 坐标。</li>
</ol>
<h2>例子</h2>
<p>每当释放鼠标时打印坐标和按钮编号。</p>
<div class="lua-example"><pre class="highlight" data-lua-kind="stmt"><span class="keyword">while</span> <span class="literal-kw">true</span> <span class="keyword">do</span>
  <span class="keyword">local</span> <span class="ident">event</span><span class="symbol">,</span> <span class="ident">button</span><span class="symbol">,</span> <span class="ident">x</span><span class="symbol">,</span> <span class="ident">y</span> <span class="symbol">=</span> <a title="Pause execution of the current thread and waits for any events matching filter." href="/module/os/#v:pullEvent"><span class="ident">os</span><span class="symbol">.</span><span class="symbol">pullEvent</span></a><span class="symbol">(</span><span class="string">&quot;mouse_up&quot;</span><span class="symbol">)</span>
  <span class="ident">print</span><span class="symbol">(</span><span class="symbol">(</span><span class="string">&quot;The mouse button %s was released at %d, %d&quot;</span><span class="symbol">)</span><span class="symbol">:</span><span class="symbol">format</span><span class="symbol">(</span><span class="ident">button</span><span class="symbol">,</span> <span class="ident">x</span><span class="symbol">,</span> <span class="ident">y</span><span class="symbol">)</span><span class="symbol">)</span>
<span class="keyword">end</span><span class="symbol"></span></pre></div>
