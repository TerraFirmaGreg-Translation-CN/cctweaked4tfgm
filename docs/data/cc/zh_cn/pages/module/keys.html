<h1>keys</h1><p>所有键盘“按键码”的常量，由 <a href="/event/key/" class="reference"><code>key</code></a> 事件排队。</p>
<p>这些值不保证在各版本之间保持不变。建议使用此文件提供的常量，而不是底层数值。</p>
<h3>更改</h3><ul><li><strong>1.4 版本新增</strong></li></ul><table class="definition-list"><tbody><tr><th class="definition-name"><a href="#v:getName">getName(code)</a></th><td>将数字键码转换为可读名称。</td></tr></tbody></table><dl class="definition"><dt><a name="v:getName" href="#v:getName"></a><span class="definition-name">getName(code)</span><a href="https://github.com/cc-tweaked/CC-Tweaked/blob/807ab862b6387fde87c11cc0c1f961760b1b100b/projects/core/src/main/resources/data/computercraft/lua/rom/apis/keys.lua#L153" class="source-link">Source</a></dt><dd><p>将数字键码转换为可读名称。该可读名称是 keys API 中的常量之一。</p> <h3>参数</h3><ol class="parameter-list"><li><span class="parameter">code</span> <span class="type"><span class="reference reference-unresolved"><code>number</code></span></span> 要查找的键码。</li></ol><h3>返回</h3><ol class="return-list"><li><span class="type"><a href="https://www.lua.org/manual/5.1/manual.html#5.4" class="reference"><code>string</code></a> | nil</span> 键的名称，如果键码无效则为 <code>nil</code>。</li></ol><h3>用法</h3><ul><li><div class="lua-example"><pre class="highlight" data-lua-kind="expr"><a title="Translates a numerical key code to a human-readable name." href="/module/keys/#v:getName"><span class="ident">keys</span><span class="symbol">.</span><span class="symbol">getName</span></a><span class="symbol">(</span><a title="Constants for all keyboard &quot;key codes&quot;, as queued by the key event." href="/module/keys/"><span class="ident">keys</span></a><span class="symbol">.</span><span class="symbol">enter</span><span class="symbol">)</span><span class="symbol"></span></pre></div></li></ul></dd></dl>
