<h1>turtle_inventory</h1><p>The <a href="/event/turtle_inventory/" class="reference"><code>turtle_inventory</code></a> event is fired when a turtle's inventory is changed.</p>
<h2>Return values</h2>
<ol>
<li><a href="https://www.lua.org/manual/5.1/manual.html#5.4" class="reference"><code>string</code></a>: The event name.</li>
</ol>
<h2>Example</h2>
<p>Prints a message when the inventory is changed:</p>
<div class="lua-example"><pre class="highlight" data-lua-kind="stmt"><span class="keyword">while</span> <span class="literal-kw">true</span> <span class="keyword">do</span>
<a title="Pause execution of the current thread and waits for any events matching filter." href="/module/os/#v:pullEvent">  <span class="ident">os</span><span class="symbol">.</span><span class="symbol">pullEvent</span></a><span class="symbol">(</span><span class="string">&quot;turtle_inventory&quot;</span><span class="symbol">)</span>
  <span class="ident">print</span><span class="symbol">(</span><span class="string">&quot;The inventory was changed.&quot;</span><span class="symbol">)</span>
<span class="keyword">end</span><span class="symbol"></span></pre></div>
